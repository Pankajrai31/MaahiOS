<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Clock face -->
  <circle cx="16" cy="16" r="13" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#D8DBE8" stroke-width="1"/>
  <!-- Hour marks -->
  <line x1="16" y1="4" x2="16" y2="6" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="28" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="6" y2="16" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="16" x2="28" y2="16" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#2B5BB5" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#DC3545"/>
</svg>