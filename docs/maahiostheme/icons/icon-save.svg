<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Floppy body -->
  <rect x="4" y="3" width="24" height="26" rx="2" ry="2" fill="#2B5BB5" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Metal shutter -->
  <rect x="9" y="3" width="14" height="9" rx="1" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Shutter slot -->
  <rect x="12" y="4.5" width="3" height="6" rx="0.5" fill="#1A1A2E"/>
  <!-- Label area -->
  <rect x="7" y="17" width="18" height="11" rx="1" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.75"/>
  <!-- Label lines -->
  <line x1="9" y1="20" x2="23" y2="20" stroke="#D8DBE8" stroke-width="1"/>
  <line x1="9" y1="23" x2="23" y2="23" stroke="#D8DBE8" stroke-width="1"/>
  <line x1="9" y1="26" x2="18" y2="26" stroke="#D8DBE8" stroke-width="1"/>
</svg>