<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ethernet plug shape -->
  <rect x="8" y="6" width="16" height="16" rx="2" ry="2" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Plug clip -->
  <rect x="12" y="4" width="8" height="4" rx="1" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Plug tab -->
  <rect x="11" y="18" width="10" height="3" rx="0.5" fill="#1A1A2E" opacity="0.3"/>
  <!-- Cable -->
  <rect x="14" y="22" width="4" height="8" rx="1" fill="#1A1A2E" opacity="0.7"/>
  <!-- Contact pins -->
  <line x1="11" y1="9" x2="11" y2="14" stroke="#E8A317" stroke-width="1" stroke-linecap="round"/>
  <line x1="14" y1="9" x2="14" y2="14" stroke="#E8A317" stroke-width="1" stroke-linecap="round"/>
  <line x1="17" y1="9" x2="17" y2="14" stroke="#E8A317" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="9" x2="20" y2="14" stroke="#E8A317" stroke-width="1" stroke-linecap="round"/>
  <!-- LED indicators -->
  <circle cx="11" cy="16.5" r="1" fill="#1E8A65"/>
  <circle cx="21" cy="16.5" r="1" fill="#E8A317"/>
</svg>