<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Collapse arrows (4 corners inward) -->
  <!-- Top-left pointing inward -->
  <path d="M4 4 L12 4 L12 12" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="4" y1="4" x2="12" y2="12" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Top-right pointing inward -->
  <path d="M28 4 L20 4 L20 12" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="4" x2="20" y2="12" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom-left pointing inward -->
  <path d="M4 28 L12 28 L12 20" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="4" y1="28" x2="12" y2="20" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom-right pointing inward -->
  <path d="M28 28 L20 28 L20 20" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="28" x2="20" y2="20" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>
</svg>