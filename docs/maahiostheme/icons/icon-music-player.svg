<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Player body -->
  <rect x="3" y="4" width="26" height="24" rx="2" ry="2" fill="#1A1A2E" stroke="#2B5BB5" stroke-width="1.5"/>
  <!-- Album art area -->
  <rect x="6" y="7" width="12" height="12" rx="1" fill="#2B5BB5"/>
  <!-- Music note on album -->
  <circle cx="10" cy="16" r="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="11.5" y="10" width="1.5" height="6" fill="#FFFFFF" opacity="0.5"/>
  <rect x="11.5" y="9.5" width="4" height="2" rx="1" fill="#FFFFFF" opacity="0.5"/>
  <!-- Track info lines -->
  <rect x="20" y="8" width="6" height="2" rx="0.5" fill="#D8DBE8" opacity="0.6"/>
  <rect x="20" y="12" width="5" height="1.5" rx="0.5" fill="#D8DBE8" opacity="0.4"/>
  <!-- Progress bar -->
  <rect x="6" y="21" width="20" height="2" rx="1" fill="#D8DBE8" opacity="0.3"/>
  <rect x="6" y="21" width="12" height="2" rx="1" fill="#2B5BB5"/>
  <circle cx="18" cy="22" r="1.5" fill="#FFFFFF"/>
  <!-- Play controls -->
  <path d="M10 25.5 L8 25.5 L8 27.5 L10 27.5 L10 25.5 M7 26.5 L5 25 L5 28 Z" fill="#D8DBE8"/>
  <path d="M15 25 L18.5 26.5 L15 28 Z" fill="#1E8A65"/>
  <path d="M22 25.5 L24 25.5 L24 27.5 L22 27.5 L22 25.5 M25 26.5 L27 25 L27 28 Z" fill="#D8DBE8"/>
</svg>