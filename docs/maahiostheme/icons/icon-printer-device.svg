<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Printer body -->
  <rect x="3" y="11" width="26" height="13" rx="2" ry="2" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Paper in tray (top) -->
  <rect x="7" y="4" width="18" height="8" rx="1" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Paper out (bottom) -->
  <rect x="7" y="22" width="18" height="7" rx="1" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Paper output lines -->
  <line x1="9" y1="25" x2="23" y2="25" stroke="#D8DBE8" stroke-width="1"/>
  <line x1="9" y1="27" x2="19" y2="27" stroke="#D8DBE8" stroke-width="1"/>
  <!-- Feed slot -->
  <rect x="5" y="14" width="22" height="2" rx="0.5" fill="#1A1A2E" opacity="0.3"/>
  <!-- Buttons -->
  <circle cx="23" cy="20" r="1.5" fill="#1E8A65"/>
  <circle cx="19" cy="20" r="1.5" fill="#E8A317"/>
</svg>