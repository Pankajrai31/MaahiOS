<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Monitor -->
  <rect x="4" y="4" width="24" height="17" rx="2" ry="2" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="2"/>
  <!-- Screen -->
  <rect x="6" y="6" width="20" height="12" rx="1" ry="1" fill="#2B5BB5"/>
  <!-- Screen highlight -->
  <rect x="7" y="7" width="8" height="4" rx="1" fill="#3A6BC5" opacity="0.5"/>
  <!-- Stand neck -->
  <rect x="13" y="21" width="6" height="3" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Stand base -->
  <rect x="9" y="24" width="14" height="3" rx="1.5" ry="1.5" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Power indicator -->
  <circle cx="16" cy="19" r="1" fill="#1E8A65"/>
</svg>