  <rect x="3" y="10" width="26" height="17" rx="3" ry="3" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Top section / viewfinder bump -->
  <path d="M11 10 L13 6 L19 6 L21 10" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Lens -->
  <circle cx="16" cy="19" r="6" fill="#1A1A2E" stroke="#1A1A2E" stroke-width="1"/>
  <circle cx="16" cy="19" r="4.5" fill="#2B5BB5"/>
  <circle cx="16" cy="19" r="2" fill="#1A1A2E"/>
  <!-- Lens reflection -->
  <circle cx="14.5" cy="17.5" r="1" fill="#FFFFFF" opacity="0.5"/>
  <!-- Flash -->
  <rect x="23" y="12" width="3" height="2" rx="0.5" fill="#E8A317"/>
  <!-- Shutter button -->
  <circle cx="7" cy="12" r="1.5" fill="#DC3545"/>
