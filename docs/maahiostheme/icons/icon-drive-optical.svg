<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Disc drive body -->
  <rect x="3" y="8" width="26" height="16" rx="2" ry="2" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="2"/>
  <!-- Disc visible through slot -->
  <circle cx="16" cy="16" r="6" fill="#2B5BB5" opacity="0.3" stroke="#1A1A2E" stroke-width="1"/>
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.75"/>
  <!-- Disc shimmer -->
  <path d="M12 13 Q16 11 20 13" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.5"/>
  <!-- Eject button -->
  <path d="M24 20 L26 20 L25 18.5 Z" fill="#1A1A2E"/>
  <!-- Tray line -->
  <line x1="4" y1="22" x2="28" y2="22" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Activity LED -->
  <circle cx="6" cy="20" r="1" fill="#1E8A65"/>
</svg>