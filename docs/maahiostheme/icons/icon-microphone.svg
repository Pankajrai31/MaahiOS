  <!-- Mic grille lines -->
  <line x1="13" y1="7" x2="19" y2="7" stroke="#1A1A2E" stroke-width="0.75" opacity="0.4"/>
  <line x1="13" y1="10" x2="19" y2="10" stroke="#1A1A2E" stroke-width="0.75" opacity="0.4"/>
  <line x1="13" y1="13" x2="19" y2="13" stroke="#1A1A2E" stroke-width="0.75" opacity="0.4"/>
  <!-- Mic holder arc -->
