<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- USB body -->
  <rect x="8" y="4" width="16" height="20" rx="2" ry="2" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="2"/>
  <!-- USB connector -->
  <rect x="10" y="24" width="12" height="5" rx="1" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- USB internal contacts -->
  <rect x="12" y="25" width="3" height="3" rx="0.5" fill="#1A1A2E" opacity="0.4"/>
  <rect x="17" y="25" width="3" height="3" rx="0.5" fill="#1A1A2E" opacity="0.4"/>
  <!-- LED indicator -->
  <circle cx="16" cy="8" r="1.5" fill="#2B5BB5"/>
  <!-- USB symbol hint -->
  <path d="M16 12 L16 19 M13 14 L16 12 L19 14" fill="none" stroke="#1A1A2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top highlight -->
  <rect x="9" y="5" width="14" height="2" rx="1" fill="#FFFFFF" opacity="0.3"/>
</svg>