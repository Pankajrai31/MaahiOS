<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Magnifying glass -->
  <circle cx="14" cy="14" r="9" fill="#FFFFFF" stroke="#2B5BB5" stroke-width="2"/>
  <!-- Handle -->
  <line x1="20.5" y1="20.5" x2="28" y2="28" stroke="#2B5BB5" stroke-width="3" stroke-linecap="round"/>
  <!-- Glass reflection -->
  <path d="M9 10 Q11 7 14 7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="14" cy="14" r="6" fill="none" stroke="#D8DBE8" stroke-width="1" opacity="0.5"/>
</svg>