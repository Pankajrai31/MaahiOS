<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- House body -->
  <path d="M5 17 L16 6 L27 17" fill="none" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- House walls -->
  <rect x="7" y="16" width="18" height="12" rx="1" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1.5"/>
  <!-- Roof filled -->
  <path d="M5 17 L16 6 L27 17 Z" fill="#2B5BB5" stroke="#1A1A2E" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="13" y="21" width="6" height="7" rx="1" fill="#E8A317" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Door knob -->
  <circle cx="17.5" cy="25" r="0.8" fill="#1A1A2E"/>
  <!-- Window left -->
  <rect x="8.5" y="18.5" width="3.5" height="3.5" rx="0.5" fill="#2B5BB5" opacity="0.3" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Window right -->
  <rect x="20" y="18.5" width="3.5" height="3.5" rx="0.5" fill="#2B5BB5" opacity="0.3" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Chimney -->
  <rect x="21" y="8" width="3" height="7" rx="0.5" fill="#D8DBE8" stroke="#1A1A2E" stroke-width="1"/>
</svg>