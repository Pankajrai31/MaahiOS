  <rect x="21" y="16" width="3" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
  <rect x="25" y="16" width="3" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
  <!-- Row 3 - spacebar -->
  <rect x="4" y="20" width="3" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
  <rect x="8" y="20" width="16" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
