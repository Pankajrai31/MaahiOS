  <rect x="20" y="12" width="3" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
  <rect x="24" y="12" width="4" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
  <!-- Row 2 -->
  <rect x="4" y="16" width="4" height="3" rx="0.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="0.5"/>
