<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Battery body -->
  <rect x="3" y="10" width="23" height="12" rx="2" ry="2" fill="none" stroke="#1A1A2E" stroke-width="2"/>
  <!-- Battery tip -->
  <rect x="26" y="13" width="3" height="6" rx="1" fill="#1A1A2E"/>
  <!-- Battery charge level -->
  <rect x="5" y="12" width="19" height="8" rx="1" fill="#1E8A65"/>
  <!-- Highlight -->
  <rect x="5" y="12" width="19" height="3" rx="1" fill="#FFFFFF" opacity="0.2"/>
</svg>