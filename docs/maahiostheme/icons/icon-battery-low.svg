<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Battery body -->
  <rect x="3" y="10" width="23" height="12" rx="2" ry="2" fill="none" stroke="#1A1A2E" stroke-width="2"/>
  <!-- Battery tip -->
  <rect x="26" y="13" width="3" height="6" rx="1" fill="#1A1A2E"/>
  <!-- Battery low charge -->
  <rect x="5" y="12" width="5" height="8" rx="1" fill="#DC3545"/>
  <!-- Warning flash on battery -->
  <path d="M16 12 L13 16.5 L16 16.5 L14 20 L19 15.5 L16 15.5 L18 12 Z" fill="#DC3545" opacity="0.5"/>
</svg>